name: Publish signed update feed

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    # The production Sparkle key authorizes updates for every installed app.
    # Only sign from main, and only inside the protected environment that holds
    # SPARKLE_ED_PRIVATE_KEY (configure required reviewers on it; see
    # docs/DISTRIBUTION.md).
    if: github.ref == 'refs/heads/main'
    environment: sparkle-release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_TEAM_ID: ${{ vars.WOOKEY_TEAM_ID }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          release_state="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [[ "$release_state" != "false false" ]]; then
            echo "v$VERSION must be a published, non-prerelease release (draft prerelease: $release_state)." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "Set the WOOKEY_TEAM_ID variable on the sparkle-release environment to the Developer ID team ID." >&2
            exit 1
          fi

      - name: Resolve Sparkle tools
        env:
          VERSION: ${{ inputs.version }}
        run: ./script/build_bundle.sh "$VERSION" "$GITHUB_RUN_NUMBER"

      - name: Download notarized release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p feed
          release_assets="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          release_stem="Wookey-$VERSION"
          if ! grep -Fxq "$release_stem.dmg" <<< "$release_assets"; then
            echo "No versioned DMG was found for v$VERSION." >&2
            exit 1
          fi
          printf '%s\n' "RELEASE_STEM=$release_stem" >> "$GITHUB_ENV"
          if ! grep -Fxq "$release_stem.dmg.sha256" <<< "$release_assets"; then
            echo "No checksum file was found for v$VERSION." >&2
            exit 1
          fi
          checksum_dir="$(mktemp -d)"
          printf '%s\n' "CHECKSUM_DIR=$checksum_dir" >> "$GITHUB_ENV"
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$release_stem.dmg" \
            --dir feed
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$release_stem.dmg.sha256" \
            --dir "$checksum_dir"
          gh release view "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq .body > "feed/$release_stem.md"
          git fetch origin update-feed:refs/remotes/origin/update-feed || true
          if git show-ref --verify --quiet refs/remotes/origin/update-feed; then
            git show origin/update-feed:appcast.xml > feed/appcast.xml
          fi

      - name: Verify notarized Developer ID release
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_TEAM_ID: ${{ vars.WOOKEY_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="feed/$RELEASE_STEM.dmg"
          expected_sum="$(awk '{print $1; exit}' "$CHECKSUM_DIR/$RELEASE_STEM.dmg.sha256")"
          actual_sum="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          if [[ -z "$expected_sum" || "$expected_sum" != "$actual_sum" ]]; then
            echo "The downloaded DMG does not match the published checksum." >&2
            exit 1
          fi
          printf '%s\n' "DMG_SHA256=$actual_sum" >> "$GITHUB_ENV"

          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          dmg_team="$(codesign -dv --verbose=2 "$dmg" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ "$dmg_team" != "$EXPECTED_TEAM_ID" ]]; then
            echo "DMG is signed by team '$dmg_team', expected '$EXPECTED_TEAM_ID'." >&2
            exit 1
          fi

          mount_point="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount_point" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT
          app="$mount_point/Wookey.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          app_team="$(codesign -dv --verbose=2 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ "$app_team" != "$EXPECTED_TEAM_ID" ]]; then
            echo "Wookey.app is signed by team '$app_team', expected '$EXPECTED_TEAM_ID'." >&2
            exit 1
          fi
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ "$app_version" != "$VERSION" ]]; then
            echo "Wookey.app reports version $app_version, expected $VERSION." >&2
            exit 1
          fi

      - name: Generate signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "SPARKLE_ED_PRIVATE_KEY is not configured." >&2
            exit 1
          fi
          # Sign exactly the bytes verified above.
          if [[ "$(shasum -a 256 "feed/$RELEASE_STEM.dmg" | awk '{print $1}')" != "$DMG_SHA256" ]]; then
            echo "The DMG changed after verification." >&2
            exit 1
          fi
          appcast_tool="$(find .build-bundle/DerivedData/SourcePackages/artifacts -type f -name generate_appcast -print -quit)"
          if [[ -z "$appcast_tool" ]]; then
            echo "Sparkle generate_appcast tool was not found." >&2
            exit 1
          fi
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$appcast_tool" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --release-notes-url-prefix "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update-feed/" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            --maximum-versions 3 \
            feed
          grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" feed/appcast.xml

      - name: Attach appcast to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release upload "v$VERSION" feed/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish update feed branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          feed_parent="$(mktemp -d)"
          feed_worktree="$feed_parent/feed"
          if git show-ref --verify --quiet refs/remotes/origin/update-feed; then
            git worktree add --detach "$feed_worktree" origin/update-feed
            git -C "$feed_worktree" switch -C update-feed
          else
            git worktree add --detach "$feed_worktree"
            git -C "$feed_worktree" switch --orphan update-feed
            git -C "$feed_worktree" rm -rf --ignore-unmatch .
          fi
          cp feed/appcast.xml "$feed_worktree/appcast.xml"
          cp "feed/$RELEASE_STEM.md" "$feed_worktree/$RELEASE_STEM.md"
          git -C "$feed_worktree" add appcast.xml "$RELEASE_STEM.md"
          if git -C "$feed_worktree" diff --cached --quiet; then
            echo "Update feed is already current."
            exit 0
          fi
          git -C "$feed_worktree" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update appcast for v$VERSION"
          git -C "$feed_worktree" push origin update-feed
