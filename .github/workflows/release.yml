name: Preview release

on:
  push:
    tags:
      - "preview-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read version
        run: |
          version="${GITHUB_REF_NAME#preview-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version"
          build_number=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          echo "WOOKEY_VERSION=$version" >> "$GITHUB_ENV"
          echo "WOOKEY_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Build preview DMG
        run: ./script/package_release.sh "$WOOKEY_VERSION" "$WOOKEY_BUILD_NUMBER"

      - name: Verify checksum
        run: |
          cd dist
          shasum -a 256 -c "Wookey-$WOOKEY_VERSION.dmg.sha256"

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          printf '%s\n\n%s\n' \
            'This is an open-source preview build and has not been notarized by Apple.' \
            'See docs/INSTALL.md before installing.' > "$notes"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/Wookey-$WOOKEY_VERSION.dmg" \
              "dist/Wookey-$WOOKEY_VERSION.dmg.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/Wookey-$WOOKEY_VERSION.dmg" \
              "dist/Wookey-$WOOKEY_VERSION.dmg.sha256" \
              --title "Wookey $WOOKEY_VERSION" \
              --notes-file "$notes" \
              --generate-notes \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

      # Preview builds are ad-hoc signed and not notarized, so they are never
      # signed with the production Sparkle EdDSA key: a signature from that key is
      # an update authorization every installed app trusts. Do not add
      # SPARKLE_ED_PRIVATE_KEY to this workflow. Production feed signing is owned
      # by publish-appcast.yml, behind the protected "sparkle-release" environment.
