name: Wookey
options:
  bundleIdPrefix: com.wikey
  developmentLanguage: ko
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.2.52"
    CURRENT_PROJECT_VERSION: "1002052"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  WookeyCore:
    type: framework
    platform: macOS
    sources:
      - Sources/WookeyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wikey.core
        GENERATE_INFOPLIST_FILE: YES

  WookeyLoginHelper:
    type: application
    platform: macOS
    sources:
      - Sources/WookeyLoginHelper
    info:
      path: Resources/WookeyLoginHelper-Info.plist
      properties:
        CFBundleDisplayName: Wookey 로그인 도우미
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wikey.login-helper
        PRODUCT_NAME: WookeyLoginHelper
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  Wookey:
    type: application
    platform: macOS
    sources:
      - Sources/Wookey
    info:
      path: Resources/Wookey-Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        CFBundleDisplayName: Wookey
        CFBundleLocalizations:
          - ko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUFeedURL: https://raw.githubusercontent.com/movvgli/Wookey/update-feed/appcast.xml
        SUPublicEDKey: KYMCwU1bB70rz+f0DguhjotRDSs/5nrJqSRul09YeZE=
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wikey.app
        PRODUCT_NAME: Wookey
        PRODUCT_MODULE_NAME: Wikey
        EXECUTABLE_NAME: Wookey
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: WookeyCore
      - target: WookeyLoginHelper
        embed: false
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - name: Embed Login Helper
        basedOnDependencyAnalysis: false
        script: |
          set -e
          destination="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LoginItems"
          mkdir -p "${destination}"
          rm -rf "${destination}/WookeyLoginHelper.app"
          cp -R "${BUILT_PRODUCTS_DIR}/WookeyLoginHelper.app" "${destination}/"
    scheme:
      testTargets:
        - WookeyCoreTests

  WookeyCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/WookeyCoreTests
    dependencies:
      - target: WookeyCore
